<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Park - Register</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="reg-screen">
  <div class="reg-card">
    <div class="reg-wordmark">Park</div>

    <div class="progress">
      <div class="prog-dot active" id="p1"></div>
      <div class="prog-dot" id="p2"></div>
      <div class="prog-dot" id="p3"></div>
    </div>

    <div class="reg-step show" id="rs1">
      <div class="step-heading">Your name</div>
      <div class="step-hint">Enter your full name to get started.</div>
      <div class="f">
        <label>Full name</label>
        <input id="i-name" type="text" placeholder="Name Surname" autocomplete="off">
        <div class="f-err" id="e-name"></div>
      </div>
      <button class="btn-main" onclick="go(1)">Continue -></button>
    </div>

    <div class="reg-step" id="rs2">
      <div class="step-heading">Phone number</div>
      <div class="step-hint">We'll use this to identify your account.</div>
      <div class="f">
        <label>Phone</label>
        <input id="i-phone" type="tel" placeholder="+7 777 777 77 77" autocomplete="off">
        <div class="f-err" id="e-phone"></div>
      </div>
      <button class="btn-main" onclick="go(2)">Continue -></button>
    </div>

    <div class="reg-step" id="rs3">
      <div class="step-heading">License plate</div>
      <div class="step-hint">Enter your vehicle's plate number.</div>
      <div class="f">
        <label>Plate number</label>
        <input id="i-plate" type="text" placeholder="111 LLL 11" autocomplete="off"
          oninput="this.value=this.value.toUpperCase()">
        <div class="f-err" id="e-plate"></div>
      </div>
      <button class="btn-main" id="btn-register" onclick="go(3)">Go to parking -></button>
    </div>

    <div style="margin-top: 1.4rem; text-align:center; font-size: 0.75rem; color:var(--mid)">
      Already registered? <a href="login.html" style="color:var(--ink); text-underline-offset:3px">Sign in</a>
    </div>
  </div>
</div>

<script src="api.js"></script>
<script>
let step = 1;

if (getToken()) {
  window.location.href = 'dashboard.html';
}

function go(s) {

  if (s === 1) {
    let name = document.getElementById('i-name').value.trim();
    if (name === "") {
      showError('i-name', 'e-name', 'Enter your name');
      return;
    }
    step = 2;
    showStep(2);
  }

  else if (s === 2) {
    let phone = document.getElementById('i-phone').value.trim();
    let digits = phone.replace(/\D/g, '');
    if (digits.length < 7) {
      showError('i-phone', 'e-phone', 'Enter a valid phone number');
      return;
    }
    step = 3;
    showStep(3);
  }

  else if (s === 3) {
    let plate = document.getElementById('i-plate').value.trim();
    if (plate === "") {
      showError('i-plate', 'e-plate', 'Enter your plate number');
      return;
    }
    register();
  }
}

async function register() {
  let btn = document.getElementById('btn-register');
  btn.textContent = 'Loading...';
  btn.disabled = true;

  let body = {
    name:  document.getElementById('i-name').value.trim(),
    phone: document.getElementById('i-phone').value.trim(),
    plate: document.getElementById('i-plate').value.trim()
  };

  try {
    let res = await apiPost('/api/auth/register', body);
    let data = await res.json();

    if (res.ok) {
      setToken(data.token || data.access_token);
      localStorage.setItem('park_user', JSON.stringify(data.user || body));
      window.location.href = 'dashboard.html';
    } else {
      showError('i-plate', 'e-plate', data.detail || 'Registration failed');
      btn.textContent = 'Go to parking ->';
      btn.disabled = false;
    }
  } catch (e) {
    showError('i-plate', 'e-plate', 'Server not available');
    btn.textContent = 'Go to parking ->';
    btn.disabled = false;
  }
}

function showStep(n) {
  for (let i = 1; i <= 3; i++) {
    let stepBlock = document.getElementById('rs' + i);
    let dot = document.getElementById('p' + i);
    if (i === n) { stepBlock.classList.add('show'); }
    else { stepBlock.classList.remove('show'); }
    if (i <= n) { dot.classList.add('active'); }
    else { dot.classList.remove('active'); }
  }
}

function showError(inputId, errorId, message) {
  let input = document.getElementById(inputId);
  let error = document.getElementById(errorId);
  error.textContent = message;
  input.classList.add('shake');
  setTimeout(function () {
    input.classList.remove('shake');
    error.textContent = "";
  }, 1400);
}

document.addEventListener('keydown', function (e) {
  if (e.key === 'Enter') { go(step); }
});
</script>

</body>
</html>
